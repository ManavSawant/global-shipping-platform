spring:
  application:
    name: global-shipping-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shipping_db}
    username: ${DB_USERNAME:mns666}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}
